<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output Methods in JS</title>
</head>

<body>
    <p id="demo"></p>

    <script>
        document.getElementById("demo").innerHTML = "Output using innerHTML";
        document.write("Output using document.write");
        console.log("Output in the console");
        print("Output using print");
        alert("This is the alert BOX");
        confirm("This is Confirm Box");
    </script>
</body>

</html>
